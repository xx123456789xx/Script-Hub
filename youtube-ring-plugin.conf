# ===== Ring 插件（由 Script Hub 从 Surge 模块 / Loon 插件 / QX 重写转换） =====
# name: Youtube (Music) Enhance
# desc: 适用于 Youtube & Youtube Music
# 参数烘焙: 屏蔽上传按钮 = true（Ring 插件无参数机制，原模板参数已替换为默认值）
# 参数烘焙: 屏蔽选段按钮 = true（Ring 插件无参数机制，原模板参数已替换为默认值）
# 参数烘焙: 屏蔽Shorts按钮 = false（Ring 插件无参数机制，原模板参数已替换为默认值）
# 参数烘焙: 字幕翻译语言 = off（Ring 插件无参数机制，原模板参数已替换为默认值）
# 参数烘焙: 启用调试模式 = false（Ring 插件无参数机制，原模板参数已替换为默认值）

[Script]
youtube.response = type=http-response, pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch|log_event|config))(\?(.*))?$, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.response.js, requires-body=true, binary-body-mode=true, engine=webview, max-size=-1, argument="{\"captionLang\":\"off\",\"blockUpload\":true,\"blockImmersive\":true,\"blockShorts\":false,\"debug\":false}"

youtube.request.init = type=http-request, pattern=^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&ack.*, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js, requires-body=true, binary-body-mode=true, engine=webview, max-size=-1, argument="{\"captionLang\":\"off\"}"

youtube.request.log_event = type=http-request, pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/log_event, script-path=https://raw.githubusercontent.com/Maasea/sgmodule/master/Script/Youtube/youtube.request.js, requires-body=true, binary-body-mode=true, engine=webview, max-size=-1

[MITM]
hostname = %APPEND% *.googlevideo.com, youtubei.googleapis.com
