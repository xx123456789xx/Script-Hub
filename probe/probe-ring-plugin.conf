# ===== Ring 脚本探针插件（诊断用，验完可删） =====
# 探针B: 浏览器打开 https://example.com/probe-test ，若脚本生效会显示 RING SCRIPT PROBE OK
# 探针A: 打开 YouTube 后，日志里应出现 RING_PROBE hit 字样

[Script]
探针B-https = type=http-request, pattern=^https://example\.com/probe-test, script-path=https://raw.githubusercontent.com/xx123456789xx/Script-Hub/main/probe/probe.js, timeout=10
探针B-http = type=http-request, pattern=^http://example\.com/probe-test, script-path=https://raw.githubusercontent.com/xx123456789xx/Script-Hub/main/probe/probe.js, timeout=10
探针A = type=http-request, pattern=^https://youtubei\.googleapis\.com/youtubei/v1/log_event, script-path=https://raw.githubusercontent.com/xx123456789xx/Script-Hub/main/probe/probe.js, timeout=10

[MITM]
hostname = %APPEND% youtubei.googleapis.com, example.com
